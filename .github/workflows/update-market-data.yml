name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: db-write
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter db run generate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - run: pnpm --recursive run build
      - run: pnpm --filter batch run hourly
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  predict:
    needs: update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: モデルが存在するインターバルの推論を実行
        run: |
          for interval in 1h 4h 1d; do
            if [ -f "models/ml-v1/$interval/model.txt" ]; then
              INTERVAL="$interval" uv run predict-signals
            fi
          done
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
