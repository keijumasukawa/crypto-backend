[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest]
addopts = ["--import-mode=importlib"]
