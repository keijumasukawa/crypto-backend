[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "adbc-driver-postgresql>=1.12.0",
    "polars>=1.43.2",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.mypy]
strict = true

[tool.pytest]
addopts = ["--import-mode=importlib"]
